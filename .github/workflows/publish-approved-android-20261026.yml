name: Publish Neves Estoque Android 0.38.0-alpha01 (approved 2026-10-26)

# Retriggered after correcting the one-time publisher; only explicit file updates trigger release.
# Never publishes for ordinary feature/CI pushes.
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/publish-approved-android-20261026.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: neves-approved-android-20261026
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SOURCE_SHA: 812ff87be84f67c77b2dacebd4248ae801e941fc
      APPROVED_ARTIFACT_SHA: 812ff87be84f67c77b2dacebd4248ae801e941fc
      APPROVED_ANDROID_CI_RUN_ID: "40391731301"
      EXPECTED_VERSION: 0.38.0-alpha01
      EXPECTED_VERSION_CODE: "38"
      TAG: android-v0.38.0-alpha01
    steps:
      - name: Verify explicitly approved source, CI result and unique release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$GITHUB_REPOSITORY" = "BabyCatBE/neves-estoque"
          python3 - <<'PY'
          import json, os, subprocess
          obj=json.loads(subprocess.check_output(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['APPROVED_ANDROID_CI_RUN_ID']}"],text=True))
          assert obj["conclusion"] == "success", "Android CI has not succeeded"
          assert obj["head_sha"] == os.environ["APPROVED_SOURCE_SHA"], "CI SHA mismatch"
          assert obj["event"] == "push", "Unexpected source CI event"
          left=json.loads(subprocess.check_output(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/git/commits/{os.environ['APPROVED_SOURCE_SHA']}"],text=True))
          right=json.loads(subprocess.check_output(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/git/commits/{os.environ['APPROVED_ARTIFACT_SHA']}"],text=True))
          assert left["tree"]["sha"] == right["tree"]["sha"], "Signed artifact tree differs from approved PR source"
          print("Signed-source CI run and commit verified.")
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Official Release already exists. Refusing replacement."
            exit 1
          fi
          # Se existir tag de uma tentativa interrompida, ela só é aceita se
          # apontar exatamente ao commit aprovado. Não mover/substituir tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/previous-tag.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/previous-tag.json" <<'PY'
          import json, os, sys
          ref=json.load(open(sys.argv[1], encoding="utf-8"))
          assert ref["object"]["type"]=="commit", "Existing tag type is not a commit"
          assert ref["object"]["sha"]==os.environ["APPROVED_SOURCE_SHA"], "Existing tag does not match approved CI SHA"
          print("Existing tag matches exact approved commit.")
          PY
          fi

      - name: Download exact APK signed and tested by Android CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed
          gh run download "$APPROVED_ANDROID_CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "neves-estoque-android-signed-$EXPECTED_VERSION-$APPROVED_ARTIFACT_SHA" --dir signed
          test -s signed/app-release.apk
          test -s signed/SHA256SUMS
          ( cd signed && sha256sum -c SHA256SUMS )

      - name: Install Android verification tools (no APK rebuilding)
        uses: android-actions/setup-android@v4

      - name: Verify package, version and permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs signed/app-release.apk > signed/verified-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 9901a1ea1fac3b993449a981770f63759b3b74e8c007f3ff9f56f1cbc7e6017a" signed/verified-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signed/app-release.apk > signed/verified-badging.txt
          grep -q "package: name='com.babycatbe.nevesestoque'.*versionCode='38'.*versionName='0.38.0-alpha01'" signed/verified-badging.txt
          python3 - <<'PY'
          import json
          with open("signed/output-metadata.json",encoding="utf-8") as f: d=json.load(f)
          assert d["applicationId"]=="com.babycatbe.nevesestoque"
          assert all(x["versionCode"]==38 and x["versionName"]=="0.38.0-alpha01" for x in d["elements"])
          print("Package and version verified: com.babycatbe.nevesestoque, 38 / 0.38.0-alpha01.")
          PY

      - name: Verify immutable approved-source branch
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/android-0.38.0-alpha01-approved-source" > "$RUNNER_TEMP/release-source-ref.json"
          python3 - "$RUNNER_TEMP/release-source-ref.json" <<'PY'
          import json, os, sys
          ref=json.load(open(sys.argv[1], encoding="utf-8"))
          assert ref["ref"]=="refs/heads/release/android-0.38.0-alpha01-approved-source"
          assert ref["object"]["type"]=="commit"
          assert ref["object"]["sha"]==os.environ["APPROVED_SOURCE_SHA"]
          print("Existing release source branch points to exactly approved CI SHA.")
          PY

      - name: Publish official release using unchanged validated APK
        shell: bash
        run: |
          set -euo pipefail
          cp signed/app-release.apk signed/neves-estoque-android.apk
          (cd signed && sha256sum neves-estoque-android.apk > SHA256SUMS)
          printf '%s\n' \
            'Neves Estoque Android 0.38.0-alpha01' \
            '' \
            'versionCode: 38' \
            '' \
            '- Conferência: estoque de referência e seleção de produtos para pedido.' \
            '- Compras: simulação dos marcados, quantidades editáveis e compartilhamento.' \
            '- Seleção local privada, sem criar Entrada ou alterar estoque.' \
            '- Release com APK exato aprovado na CI Android.' \
            '' \
            'CI Android validada. Teste manual em aparelho segue pendente.' > release-notes.md
          gh release create "$TAG" \
            signed/neves-estoque-android.apk \
            signed/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "release/android-0.38.0-alpha01-approved-source" \
            --title "Neves Estoque Android $EXPECTED_VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Verify publication for built-in Android updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]; tag=os.environ["TAG"]
          d=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases/tags/{tag}"],text=True))
          assert not d["draft"] and not d["prerelease"]
          assert d["tag_name"]==tag
          assert "versionCode: 38" in (d.get("body") or "")
          assets=[x["name"] for x in d["assets"]]
          assert assets.count("neves-estoque-android.apk")==1
          assert assets.count("SHA256SUMS")==1
          print("Official APK Release published and verified.")
          PY
