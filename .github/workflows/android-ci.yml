name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-device-id
      - feat/android-12-release-preparation
      - develop
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: android sdk install --beta platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Check APK runtime config
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase runtime config: configured"
          else
            echo "::warning title=APK runtime config::SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY not configured; APK installs but login will be unavailable."
          fi

      - name: Lint, unit tests and debug APK build
        shell: bash
        run: |
          set -o pipefail
          gradle -p android --no-daemon --continue :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-build.log

      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neves-estoque-android-debug-0.22.0-alpha01
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Publica os erros como anotações da execução, legíveis pela API do GitHub
      # mesmo quando o log completo não está acessível.
      - name: Publish build failure details
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error:|FAILED|AssertionError|ComparisonFailure|expected:<|Lint found|What went wrong' android-build.log \
            | grep -v '^> Task' | head -40 | while IFS= read -r line; do
              echo "::error title=Android build::${line//$'\r'/}"
            done
          for report in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$report" ] || continue
            python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for failure in list(case.findall("failure")) + list(case.findall("error")):
                  message = (failure.get("message") or failure.text or "").strip().splitlines()[0][:400]
                  print(f"::error title=Test {case.get('classname')}.{case.get('name')}::{message}")
          PY
          done
          if [ -f android/app/build/reports/lint-results-debug.txt ]; then
            grep -E 'Error:' android/app/build/reports/lint-results-debug.txt | head -20 | while IFS= read -r line; do
              echo "::error title=Android lint::$line"
            done
          fi
