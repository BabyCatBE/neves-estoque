name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-device-id
      - develop
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: android sdk install --beta platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Lint, unit tests and debug APK build
        run: gradle -p android --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
