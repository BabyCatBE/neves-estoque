name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-device-id
      - feat/android-12-release-preparation
      - develop
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: android sdk install --beta platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Android signing::Required Repository Secret $name is not configured."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neves-estoque.jks"
          test -s "$RUNNER_TEMP/neves-estoque.jks"

      - name: Check APK runtime config
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase runtime config: configured"
          else
            echo "::error title=APK runtime config::SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY must be configured for release validation."
            exit 1
          fi

      - name: Verify release configuration guard
        shell: bash
        run: |
          set -euo pipefail
          if gradle -p android --no-daemon :app:validateReleaseConfig -PSUPABASE_URL= > release-guard.log 2>&1; then
            echo "::error::Release accepted an empty URL."
            exit 1
          fi
          grep -q "Release requires a valid HTTPS" release-guard.log
          if gradle -p android --no-daemon :app:validateReleaseConfig -PSUPABASE_URL=https://example.supabase.co -PSUPABASE_PUBLISHABLE_KEY=sb_secret_rejected_test_value > release-guard.log 2>&1; then
            echo "::error::Release accepted a private key."
            exit 1
          fi
          grep -q "private or invalid keys are forbidden" release-guard.log

      - name: Lint, unit tests and debug/release APK build
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/neves-estoque.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android --no-daemon --continue :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:lintRelease :app:assembleRelease 2>&1 | tee android-build.log

      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neves-estoque-android-debug-0.25.0-alpha01
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify signed release APK
        if: success()
        working-directory: android/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app-release.apk | tee SIGNATURE.txt
          expected_cert="9901a1ea1fac3b993449a981770f63759b3b74e8c007f3ff9f56f1cbc7e6017a"
          actual_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' SIGNATURE.txt | tr '[:upper:]' '[:lower:]')
          test "$actual_cert" = "$expected_cert" || { echo "::error::Release certificate differs from the approved permanent certificate."; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app-release.apk > APK_BADGING.txt
          grep -q "package: name='com.babycatbe.nevesestoque'.*versionCode='25'.*versionName='0.25.0-alpha01'" APK_BADGING.txt
          python3 - <<'PYTHON'
          import json
          with open("output-metadata.json") as file:
              metadata = json.load(file)
          assert metadata["applicationId"] == "com.babycatbe.nevesestoque"
          assert all(item["versionCode"] == 25 and item["versionName"] == "0.25.0-alpha01" for item in metadata["elements"])
          print("Release identity verified: 0.25.0-alpha01 / versionCode 25 / permanent certificate")
          PYTHON

      - name: Checksum signed release APK
        if: success()
        working-directory: android/app/build/outputs/apk/release
        run: sha256sum app-release.apk | tee SHA256SUMS

      - name: Publish signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neves-estoque-android-signed-0.25.0-alpha01-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS
            android/app/build/outputs/apk/release/SIGNATURE.txt
            android/app/build/outputs/apk/release/APK_BADGING.txt
            android/app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 30

      # Publica os erros como anotações da execução, legíveis pela API do GitHub
      # mesmo quando o log completo não está acessível.
      - name: Publish build failure details
        if: failure()
        shell: bash
        run: |
          for build_log in android-build.log release-guard.log; do
            [ -f "$build_log" ] || continue
            grep -E '^e: |error:|FAILED|AssertionError|ComparisonFailure|expected:<|Lint found|What went wrong|Release requires' "$build_log" \
            | grep -v '^> Task' | head -40 | while IFS= read -r line; do
              echo "::error title=Android build::${line//$'\r'/}"
            done || true
          done
          for report in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$report" ] || continue
            python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for failure in list(case.findall("failure")) + list(case.findall("error")):
                  message = (failure.get("message") or failure.text or "").strip().splitlines()[0][:400]
                  print(f"::error title=Test {case.get('classname')}.{case.get('name')}::{message}")
          PY
          done
          for variant in debug release; do
            if [ -f android/app/build/reports/lint-results-$variant.txt ]; then
            grep -E 'Error:' android/app/build/reports/lint-results-$variant.txt | head -20 | while IFS= read -r line; do
              echo "::error title=Android lint::$line"
            done
          fi
          done

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/neves-estoque.jks"

